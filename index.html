<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reactive Notebook — M1</title>
    <!-- Set the theme class before first paint to avoid a light flash. Mirrors
         src/theme/theme.ts (keep in sync); runs synchronously ahead of the app. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("telestrator:theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
